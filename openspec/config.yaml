schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: fenum — универсальные контейнеры (ulist) на struct с type-tag-диспетчером в стиле Elixir Enum, часть экосистемы VitaSound feco.
  Стек: Gforth, правила frules (.cursor/rules), package.4th.
  Проверка: fmix test, flint, fcov run && fcov report; из Cursor — MCP vitasound-forth (fmix_check, fmix_test, flint_lint, fcov_run).

rules:
  specs:
    - Scenario формулировать через стековый эффект слова и состояние контейнера до/после
  tasks:
    - Каждое требование покрывать тестом в tests/*_test.4th (ttester T{ }T)

operations:
  apply:
    guidance:
      - Перед завершением прогонять fmix check; обновлять CHANGELOG.md
